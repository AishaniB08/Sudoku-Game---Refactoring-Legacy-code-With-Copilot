<!doctype html>
<html>
<head>
  <meta charset="utf-8">
  <title>Sudoku Game</title>
  <link rel="stylesheet" href="/static/styles.css">
</head>
<body>
  <h1>Sudoku Game</h1>
  <div class="app-grid">
    <section class="game-panel">
      <div id="sudoku-board"></div>
      <div class="controls">
        <button id="new-game">New Game</button>
        <button id="check-solution">Check Solution</button>
        <button id="use-hint">Hint</button>
        <input id="player-name" type="text" placeholder="Player name" />
        <label class="theme-toggle">
          <input id="theme-toggle" type="checkbox" />
          <span>Dark Mode</span>
        </label>
        <span id="timer" class="timer-display">00:00</span>
        <span id="hints-used">Hints used: 0</span>
        <span id="message"></span>
      </div>
    </section>
    <aside class="sidebar">
      <div class="leaderboard-panel">
        <h2>Top 10 Leaderboard</h2>
        <table id="leaderboard-table">
          <thead>
            <tr>
              <th>Rank</th>
              <th>Player Name</th>
              <th>Time</th>
              <th>Difficulty</th>
              <th>Hints Used</th>
            </tr>
          </thead>
          <tbody></tbody>
        </table>
      </div>
    </aside>
  </div>
  <script src="/static/main.js"></script>
</body>
</html>
